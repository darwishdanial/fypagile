id: 49534
name: fypagile
environments:
    production:
        database: fypagile
        memory: 1024
        cli-memory: 512
        runtime: 'php-8.2:al2'
        build:
            - 'composer install'
            - 'php artisan event:cache'
            - 'del /s /q "node_modules"'
        deploy:
            - 'php artisan migrate --force'
            
